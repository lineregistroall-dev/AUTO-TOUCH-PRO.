name: Build AUTO TOUCH PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          set -e
          mkdir -p extracted
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted
          test -f extracted/AutoTouchPro/app/build.gradle.kts

      - name: Corregir compatibilidad Java y Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("extracted/AutoTouchPro/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
                  1
              )
          else:
              s = re.sub(
                  r'(?m)^(\s*sourceCompatibility\s*=\s*)JavaVersion\.\w+',
                  r'\1JavaVersion.VERSION_17', s
              )
              s = re.sub(
                  r'(?m)^(\s*targetCompatibility\s*=\s*)JavaVersion\.\w+',
                  r'\1JavaVersion.VERSION_17', s
              )

          s = re.sub(
              r'(?m)^(\s*jvmTarget\s*=\s*)["\'][^"\']+["\']',
              r'\1"17"', s
          )

          p.write_text(s, encoding="utf-8")
          print("Compatibilidad Java 17 configurada")
          PY

      - name: Compilar APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          build-root-directory: extracted/AutoTouchPro
          arguments: clean assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-TOUCH-PRO-APK
          path: extracted/AutoTouchPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
