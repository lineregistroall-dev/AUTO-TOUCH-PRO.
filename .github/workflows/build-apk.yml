
name: Build AUTO TOUCH PRO

on:
  workflow_dispatch:
  push:
    branches: [ principal ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          mkdir extracted
          unzip "$(find . -maxdepth 1 -iname '*.zip' -print -quit)" -d extracted

      - name: Compilar APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          build-root-directory: extracted/AutoTouchPro
          arguments: assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-TOUCH-PRO-APK
          path: extracted/AutoTouchPro/app/build/outputs/apk/debug/app-debug.apk
